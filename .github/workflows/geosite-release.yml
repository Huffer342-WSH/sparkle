name: GeoSite release

on:
  push:
    tags:
      - 'geosite-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'Huffer342-WSH/sparkle'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 25
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false
      - run: npm install -g pnpm@11.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Set prerelease version
        shell: bash
        run: |
          node -e "const fs=require('fs');const p=require('./package.json');p.version+='-geosite.'+process.env.GITHUB_RUN_NUMBER;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
      - run: node scripts/build-geosite-release.cjs
      - uses: actions/upload-artifact@v7
        with:
          name: geosite-${{ matrix.os }}-amd64
          path: |
            dist/*.7z
            dist/*.deb
            dist/*.sha256
            dist/core-manifest-*.json
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/geosite-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: geosite-*-amd64
          merge-multiple: true
          path: artifacts
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          printf '%s\n' 'Sparkle with GeoData startup optimizations in mihomo 02584861637ebafff55a889b1bcb3224522663d9.' 'Windows amd64 portable archive and Linux amd64 DEB. Uses normal application data; development isolation is disabled.' > notes.md
          gh release create "$RELEASE_TAG" artifacts/* --prerelease --title "Sparkle $RELEASE_TAG" --notes-file notes.md
